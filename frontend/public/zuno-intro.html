
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUNO — Discover. Build. Connect. Grow.</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #14040A;
  --ink: #FFFFFF;
  --accent: #E23A5C;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Outfit', sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(
    ellipse at 50% 48%,
    #4A0E1F 0%,
    #2A0814 45%,
    #12030A 100%
  );
}

svg {
  width: min(100vw, 177.78vh);
  height: auto;
  aspect-ratio: 16 / 9;
  display: block;
}

svg path {
  fill: none;
  stroke-width: 26;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#tg {
  font: 500 27px 'Outfit', sans-serif;
  letter-spacing: 12px;
  fill: var(--ink);
  text-anchor: middle;
}

#ui {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  justify-content: center;
  background: rgba(20, 4, 10, .9);
  transition: opacity .5s;
}

#ui.off {
  opacity: 0;
  pointer-events: none;
}

button {
  font: 500 15px 'Outfit', sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: white;
  background: transparent;
  border: 1px solid rgba(255,160,180,.45);
  border-radius: 999px;
  padding: 14px 30px;
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: rgba(226,58,92,.18);
  border-color: #FF8CA3;
}

button.quiet {
  border-color: transparent;
  opacity: .6;
  padding: 6px 14px;
  font-size: 12px;
}

#re {
  position: fixed;
  right: 18px;
  bottom: 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s;
  padding: 9px 18px;
  font-size: 12px;
}

#re.on {
  opacity: .55;
  pointer-events: auto;
}
</style>
</head>

<body>

<div id="stage">
<svg viewBox="0 0 1600 900"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="ZUNO — Discover. Build. Connect. Grow.">

<defs>
  <linearGradient id="zg"
    gradientUnits="userSpaceOnUse"
    x1="425" y1="340" x2="575" y2="540">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>

  <linearGradient id="sw"
    gradientUnits="userSpaceOnUse"
    x1="0" y1="0" x2="340" y2="0">
    <stop offset="0" stop-color="#B3223F" stop-opacity="0"/>
    <stop offset=".35" stop-color="#E23A5C" stop-opacity=".95"/>
    <stop offset=".65" stop-color="#FF8CA3" stop-opacity=".95"/>
    <stop offset="1" stop-color="#FF8CA3" stop-opacity="0"/>
  </linearGradient>

  <filter id="bl" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <filter id="bs" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>

<g id="lg" filter="url(#bl)" opacity="0"></g>
<g id="lm"></g>
<g id="ls" opacity="0"></g>

<circle id="hh" r="30" fill="#E23A5C" filter="url(#bs)" opacity="0"/>
<circle id="hc" r="6" fill="#FFF5F7" opacity="0"/>

<text id="tg" x="806" y="640" opacity="0">
DISCOVER. BUILD. CONNECT. GROW.
</text>

</svg>
</div>

<div id="ui">
  <button id="b1">▶ Play intro</button>
  <button id="b2" class="quiet">Play without sound</button>
</div>

<button id="re">↻ Replay</button>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

const clamp = x => Math.max(0, Math.min(1, x));

const ease = x =>
  x < .5
    ? 4 * x * x * x
    : 1 - Math.pow(-2 * x + 2, 3) / 2;

const D = [
  "M425 340H575L425 540H575",
  "M625 340V465A75 75 0 0 0 775 465V340",
  "M825 540V340L975 540V340",
  "M1025 415A75 75 0 0 1 1175 415V465A75 75 0 0 1 1025 465Z"
];

const S = [
  [1.9, 2.6],
  [2.65, 2.9],
  [2.95, 3.2],
  [3.25, 3.5]
];

const lay = {
  g: $('lg'),
  m: $('lm'),
  s: $('ls')
};

const it = D.map((d, i) => {
  const mk = (parent, stroke) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('stroke', stroke);
    parent.appendChild(p);
    return p;
  };

  const m = mk(lay.m, i ? '#FFFFFF' : 'url(#zg)');
  const g = mk(lay.g, '#E23A5C');
  const s = mk(lay.s, 'url(#sw)');

  const L = m.getTotalLength();

  [m, g, s].forEach(p => {
    p.style.strokeDasharray = L + ' ' + L;
  });

  return {
    m, g, s, L,
    a: m.getPointAtLength(0),
    b: m.getPointAtLength(L)
  };
});

const sw = $('sw');
const hh = $('hh');
const hc = $('hc');
const tg = $('tg');

const C = { x: 800, y: 450 };

const lerp = (a, b, u) => ({
  x: a.x + (b.x - a.x) * u,
  y: a.y + (b.y - a.y) * u
});

function render(t) {
  it.forEach((o, i) => {
    const p = ease(clamp(
      (t - S[i][0]) / (S[i][1] - S[i][0])
    ));

    [o.m, o.g, o.s].forEach(e => {
      e.style.strokeDashoffset = o.L * (1 - p);
      e.style.visibility = p > 0 ? 'visible' : 'hidden';
    });
  });

  let pos = C;
  let r = 6;
  let op = 1;

  if (t < 1.5) {
    const u = ease(clamp((t - .15) / 1.35));
    op = u;
    r = 3 + 4 * u;
    pos = C;
  } else if (t < 1.9) {
    pos = lerp(C, it[0].a, ease((t - 1.5) / .4));
    r = 7;
  } else {
    r = 7;
    pos = it[3].b;

    for (let i = 0; i < 4; i++) {
      const [a, b] = S[i];

      if (t >= a && t <= b) {
        const o = it[i];
        const p = ease((t - a) / (b - a));
        pos = o.m.getPointAtLength(o.L * p);
        break;
      }

      if (i < 3 && t > b && t < S[i + 1][0]) {
        pos = lerp(
          it[i].b,
          it[i + 1].a,
          ease((t - b) / (S[i + 1][0] - b))
        );
        break;
      }
    }
  }

  if (t > 3.5) {
    op = 1 - clamp((t - 3.5) / .3);
  }

  hc.setAttribute('cx', pos.x);
  hc.setAttribute('cy', pos.y);
  hc.setAttribute('r', r);
  hc.setAttribute('opacity', op);

  hh.setAttribute('cx', pos.x);
  hh.setAttribute('cy', pos.y);
  hh.setAttribute('r', r * 3.6);
  hh.setAttribute('opacity', op * .85);

  let g = t < 3.5
    ? .5 * clamp((t - 1.9) / 1.6)
    : t < 4.6
      ? .5 + .35 * Math.sin(Math.PI * (t - 3.5) / 1.1)
      : .5 - .38 * ease(clamp((t - 4.6) / .9));

  lay.g.setAttribute('opacity', Math.max(g, t > 4.6 ? .12 : 0));

  const su = clamp((t - 3.5) / 1.1);
  const x = 300 + 1000 * su;

  sw.setAttribute('x1', x - 170);
  sw.setAttribute('x2', x + 170);

  lay.s.setAttribute('opacity', t >= 3.5 && t < 4.65 ? 1 : 0);

  const e = ease(clamp((t - 5) / 1));

  tg.setAttribute('opacity', e);
  tg.setAttribute(
    'transform',
    'translate(0,' + (8 * (1 - e)) + ')'
  );
}

// Sound effects
let ctx = null;

function audio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  const K = 5 / 7;
  const T = ctx.currentTime + .1;

  const master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();

  master.gain.value = .85;
  master.connect(comp);
  comp.connect(ctx.destination);

  const wet = ctx.createGain();
  const conv = ctx.createConvolver();

  wet.gain.value = .5;

  const n = ctx.sampleRate * 2.6;
  const buf = ctx.createBuffer(2, n, ctx.sampleRate);

  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);

    for (let i = 0; i < n; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    }
  }

  conv.buffer = buf;

  const bus = ctx.createGain();

  bus.connect(master);
  bus.connect(conv);
  conv.connect(wet);
  wet.connect(master);

  const tone = (
    f, t, dur, v,
    type = 'sine',
    att = .01,
    hold = false,
    lp = 0
  ) => {
    t *= K;
    dur *= K;
    att *= K;

    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.type = type;
    o.frequency.value = f;

    g.gain.setValueAtTime(.0001, T + t);
    g.gain.exponentialRampToValueAtTime(v, T + t + att);

    if (hold) {
      g.gain.setValueAtTime(v, T + t + dur - 1.2 * K);
    }

    g.gain.exponentialRampToValueAtTime(.0001, T + t + dur);

    let out = g;

    o.connect(g);

    if (lp) {
      const f2 = ctx.createBiquadFilter();
      f2.type = 'lowpass';
      f2.frequency.value = lp;
      g.connect(f2);
      out = f2;
    }

    out.connect(bus);
    o.start(T + t);
    o.stop(T + t + dur + .1);
  };

  tone(110, 0, 7.2, .06, 'sine', 1.6, true);
  tone(164.8, .2, 7, .04, 'sine', 1.8, true);
  tone(220, .4, 6.8, .02, 'triangle', 2, true, 600);
  tone(1760, .35, 1.8, .012, 'sine', .5);

  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type = 'sine';
  o.frequency.setValueAtTime(330, T + 1.9 * K);
  o.frequency.exponentialRampToValueAtTime(880, T + 3.5 * K);

  g.gain.setValueAtTime(.0001, T + 1.9 * K);
  g.gain.exponentialRampToValueAtTime(.025, T + 2.8 * K);
  g.gain.exponentialRampToValueAtTime(.0001, T + 3.6 * K);

  o.connect(g);
  g.connect(bus);
  o.start(T + 1.9 * K);
  o.stop(T + 3.7 * K);

  tone(880, 3.6, 2.6, .12);
  tone(1318.5, 3.67, 2.4, .08);
  tone(1760, 3.74, 2.2, .05);
  tone(2637, 3.85, 1.6, .018);
  tone(2430, 3.6, .9, .01);

  [220, 277.2, 329.6, 440].forEach((f, i) => {
    tone(f, 5 + i * .05, 2.2, .045, 'triangle', .9, false, 1400);
  });
}

// Playback
let raf = 0;
let completed = false;

function play(sound) {
  cancelAnimationFrame(raf);

  if (ctx) {
    ctx.close();
    ctx = null;
  }

  completed = false;

  $('ui').classList.add('off');
  $('re').classList.remove('on');

  if (sound) {
    try {
      audio();
    } catch (e) {
      console.error(e);
    }
  }

  const t0 = performance.now() + 100;

  const loop = now => {
    const t = Math.max(0, (now - t0) / 1000);

    render(Math.min(t, 5) * 1.4);

    if (t < 5) {
      raf = requestAnimationFrame(loop);
    } else {
      $('re').classList.add('on');

      if (!completed) {
        completed = true;

        window.parent.postMessage(
          { type: 'ZUNO_INTRO_COMPLETE' },
          '*'
        );
      }

      setTimeout(() => {
        if (ctx) {
          ctx.close();
          ctx = null;
        }
      }, 1500);
    }
  };

  raf = requestAnimationFrame(loop);
}

$('b1').onclick = () => play(true);
$('b2').onclick = () => play(false);
$('re').onclick = () => play(false);

render(0);

// Automatically play silently whenever the page opens
window.addEventListener('load', () => {
  play(false);
});
</script>

</body>
</html>
